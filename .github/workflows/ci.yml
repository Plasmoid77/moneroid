name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
# Least privilege; only the release job may write (release assets). Actions are pinned to
# commit SHAs: the release job builds what install.sh later runs as root.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
      - run: shellcheck -s sh -S warning install.sh examples/moneroid-msr
  release:
    # A pushed tag vX.Y.Z publishes dist/ with its CHANGELOG section as the notes.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # only vX.Y.Z: install.sh takes the newest release, so a test tag must never become it
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG"; exit 0; }
          make dist VERSION="$TAG"
          awk -v v="## $TAG " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section $TAG"; exit 1; }
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md

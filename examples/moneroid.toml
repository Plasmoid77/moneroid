schema_version = 1

[services]
p2pool = "moneroid-p2pool.service"
xmrig = "moneroid-xmrig.service"

[p2pool]
data_api_dir = "/run/moneroid-p2pool-api"
# params_file = "/etc/moneroid/p2pool.conf"   # needed by the node commands and the NODE_RPC check
# nodes_file = "/etc/moneroid/nodes.txt"      # needed by the node commands

[xmrig]
api_url = "http://127.0.0.1:18088"
expected_id = "moneroid-xmrig"
# token_file = "/etc/moneroid/xmrig-api.token"   # only if http.access-token is set in xmrig.json

[ui]
refresh_ms = 1000
# price = true               # TUI: XMR in USD/EUR from CoinGecko every 10 min; false = no request at all

# [guard]                    # moneroid-guard.service; every key is optional (spec §7.1)
# interval_s = 30            # poll period, 10..600
# hold_after = 3             # not-ready polls before XMRig is stopped
# release_after = 3          # ready polls before XMRig is started again
# repair = true              # reset an isolated sidechain (needs data-dir = /var/lib/moneroid/p2pool in p2pool.conf)
# repair_after_s = 1200      # how long P2Pool must stay behind its peers without catching up
# repair_cooldown_s = 3600   # minimum time between two repairs
